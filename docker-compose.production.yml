name: ${COMPOSE_PROJECT_NAME:-teaseat-production}

x-backend-common: &backend-common
  image: ${BACKEND_IMAGE:-teaseat-backend:prod}
  build:
    context: ./backend
    dockerfile: dockerfile.production
  env_file:
    - ./backend/.env.production
  environment:
    HOME: /tmp
    XDG_CONFIG_HOME: /tmp
  restart: unless-stopped
  volumes:
    - backend_imports:/app/backend/storage/app/imports
    - backend_public:/app/backend/storage/app/public
  depends_on:
    pgsql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - data

services:
  backend:
    <<: *backend-common
    expose:
      - "8000"
    networks:
      - edge
      - data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

  worker:
    <<: *backend-common
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=900
      - --max-time=3600
    stop_grace_period: 15m

  frontend:
    image: ${FRONTEND_IMAGE:-teaseat-frontend:prod}
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
      args:
        VITE_API_URL: ""
        VITE_ADMIN_URL: /admin
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx/production-http.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/gateway-health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

  pgsql:
    image: postgres:15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in backend/.env.production}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in backend/.env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 256m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  backend_imports:
  backend_public:
  postgres_data:
  redis_data:
