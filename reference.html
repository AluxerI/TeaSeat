<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS / TS Справочник</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;color:#222}
  .layout{display:flex;min-height:100vh}
  nav{width:220px;flex-shrink:0;border-right:1px solid #ddd;padding:16px 0;position:sticky;top:0;height:100vh;overflow-y:auto;background:#fafafa}
  nav .item{padding:8px 20px;cursor:pointer;font-size:14px;color:#333;border-left:3px solid transparent;transition:.15s}
  nav .item:hover{background:#e3f2fd}
  nav .item.active{font-weight:700;color:#1976d2;border-left-color:#1976d2;background:#e3f2fd}
  main{flex:1;padding:24px 32px;overflow:auto}
  h1{margin:0 0 20px;font-size:28px;font-weight:700;color:#111}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:12px}
  .card{border:1px solid #e0e0e0;border-radius:8px;padding:14px 16px;background:#fff}
  .card code{font-size:14px;font-weight:600;color:#1565c0;background:#e3f2fd;padding:2px 6px;border-radius:4px;font-family:'JetBrains Mono','Fira Code',monospace}
  .card p{margin:6px 0 8px;font-size:14px;color:#555}
  .card pre{margin:0;padding:8px 10px;background:#263238;color:#e0e0e0;border-radius:6px;font-size:13px;overflow-x:auto;line-height:1.5;font-family:'JetBrains Mono','Fira Code',monospace}
  @media(max-width:768px){
    nav{width:160px}
    main{padding:16px}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div class="layout">
  <nav id="sidebar"></nav>
  <main id="content"></main>
</div>

<script>
const sections = [
  {
    id:"string",title:"String",
    items:[
      {name:"length",desc:"Длина строки",example:`"hello".length // 5`},
      {name:"toUpperCase() / toLowerCase()",desc:"Изменение регистра",example:`"hello".toUpperCase() // "HELLO"`},
      {name:"trim()",desc:"Удаляет пробелы с обоих концов",example:`"  hi  ".trim() // "hi"`},
      {name:"split(sep)",desc:"Разбивает строку на массив по разделителю",example:`"a,b,c".split(",") // ["a","b","c"]`},
      {name:"join(sep)",desc:"Объединяет массив в строку",example:`["a","b"].join("-") // "a-b"`},
      {name:"includes(substr)",desc:"Проверяет, содержит ли строка подстроку",example:`"hello".includes("ell") // true`},
      {name:"indexOf(substr)",desc:"Возвращает индекс первого вхождения (-1 если нет)",example:`"hello".indexOf("l") // 2`},
      {name:"slice(start,end)",desc:"Извлекает часть строки",example:`"hello".slice(1,4) // "ell"`},
      {name:"replace(a,b)",desc:"Заменяет первое вхождение",example:`"aa".replace("a","b") // "ba"`},
      {name:"replaceAll(a,b)",desc:"Заменяет все вхождения",example:`"aa".replaceAll("a","b") // "bb"`},
      {name:"startsWith() / endsWith()",desc:"Проверяет начало/конец строки",example:`"file.ts".endsWith(".ts") // true`},
      {name:"padStart() / padEnd()",desc:"Дополняет строку до нужной длины",example:`"5".padStart(3,"0") // "005"`},
      {name:"charAt(i)",desc:"Символ по индексу",example:`"abc".charAt(1) // "b"`},
      {name:"match(regex)",desc:"Поиск по регулярному выражению",example:`"a1b2".match(/\\d+/) // ["1"]`}
    ]
  },
  {
    id:"array",title:"Array",
    items:[
      {name:"push(el)",desc:"Добавляет элемент в конец",example:`[1,2].push(3) // [1,2,3]`},
      {name:"pop()",desc:"Удаляет и возвращает последний элемент",example:`[1,2,3].pop() // 3`},
      {name:"shift()",desc:"Удаляет и возвращает первый элемент",example:`[1,2,3].shift() // 1`},
      {name:"unshift(el)",desc:"Добавляет элемент в начало",example:`[2,3].unshift(1) // [1,2,3]`},
      {name:"map(fn)",desc:"Создаёт новый массив, преобразуя каждый элемент",example:`[1,2,3].map(x=>x*2) // [2,4,6]`},
      {name:"filter(fn)",desc:"Фильтрует элементы по условию",example:`[1,2,3].filter(x=>x>1) // [2,3]`},
      {name:"reduce(fn,init)",desc:"Сводит массив к одному значению",example:`[1,2,3].reduce((a,b)=>a+b,0) // 6`},
      {name:"find(fn)",desc:"Возвращает первый элемент, подходящий под условие",example:`[1,2,3].find(x=>x>1) // 2`},
      {name:"findIndex(fn)",desc:"Индекс первого подходящего элемента",example:`[1,2,3].findIndex(x=>x>1) // 1`},
      {name:"some(fn)",desc:"Проверяет, удовлетворяет ли хоть один элемент условию",example:`[1,2,3].some(x=>x>2) // true`},
      {name:"every(fn)",desc:"Проверяет, удовлетворяют ли все элементы условию",example:`[1,2,3].every(x=>x>0) // true`},
      {name:"includes(el)",desc:"Проверяет наличие элемента",example:`[1,2,3].includes(2) // true`},
      {name:"indexOf(el)",desc:"Индекс первого вхождения элемента",example:`[1,2,3].indexOf(2) // 1`},
      {name:"sort(fn)",desc:"Сортирует массив (изменяет оригинал!)",example:`[3,1,2].sort((a,b)=>a-b) // [1,2,3]`},
      {name:"reverse()",desc:"Переворачивает массив",example:`[1,2,3].reverse() // [3,2,1]`},
      {name:"concat(arr)",desc:"Объединяет массивы",example:`[1,2].concat([3,4]) // [1,2,3,4]`},
      {name:"slice(start,end)",desc:"Извлекает часть массива (не изменяя оригинал)",example:`[1,2,3].slice(1,3) // [2,3]`},
      {name:"splice(start,count,...)",desc:"Удаляет/заменяет элементы (изменяет оригинал)",example:`[1,2,3,4].splice(1,2) // [2,3], исходный [1,4]`},
      {name:"flat(depth)",desc:"Разворачивает вложенные массивы",example:`[[1,2],[3]].flat() // [1,2,3]`},
      {name:"flatMap(fn)",desc:"map()+flat() за один проход",example:`[1,2].flatMap(x=>[x,x*2]) // [1,2,2,4]`},
      {name:"fill(val,start,end)",desc:"Заполняет массив значением",example:`[1,2,3].fill(0) // [0,0,0]`},
      {name:"at(i)",desc:"Элемент по индексу (поддерживает отрицательные)",example:`[1,2,3].at(-1) // 3`},
      {name:"forEach(fn)",desc:"Перебирает элементы (без возврата)",example:`[1,2].forEach(x=>console.log(x))`},
      {name:"Array.from()",desc:"Создаёт массив из итерируемого объекта",example:`Array.from("abc") // ["a","b","c"]`},
      {name:"Array.isArray()",desc:"Проверяет, является ли значение массивом",example:`Array.isArray([1,2]) // true`}
    ]
  },
  {
    id:"object",title:"Object",
    items:[
      {name:"Object.keys(obj)",desc:"Возвращает массив ключей",example:`Object.keys({a:1,b:2}) // ["a","b"]`},
      {name:"Object.values(obj)",desc:"Возвращает массив значений",example:`Object.values({a:1,b:2}) // [1,2]`},
      {name:"Object.entries(obj)",desc:"Возвращает массив пар [ключ,значение]",example:`Object.entries({a:1}) // [["a",1]]`},
      {name:"Object.assign(target,...src)",desc:"Копирует свойства из src в target",example:`Object.assign({a:1},{b:2}) // {a:1,b:2}`},
      {name:"Object.freeze(obj)",desc:"Замораживает объект (нельзя изменять)",example:`Object.freeze({a:1})`},
      {name:"Object.hasOwn(obj,key)",desc:"Проверяет собственное свойство",example:`Object.hasOwn({a:1},"a") // true`},
      {name:"delete obj.key",desc:"Удаляет свойство",example:`const o={a:1}; delete o.a; // {}`},
      {name:"spread (...)",desc:"Оператор распространения",example:`{...{a:1},b:2} // {a:1,b:2}`},
      {name:"optional chaining (?.)",desc:"Безопасный доступ к вложенным свойствам",example:`obj?.a?.b ?? "default"`},
      {name:"nullish coalescing (??)",desc:"Значение по умолчанию (только для null/undefined)",example:`x ?? "default"`}
    ]
  },
  {
    id:"number",title:"Number / Math",
    items:[
      {name:"Number.isNaN(v)",desc:"Проверяет, является ли значение NaN",example:`Number.isNaN(NaN) // true`},
      {name:"Number.isInteger(v)",desc:"Проверяет, является ли число целым",example:`Number.isInteger(2.5) // false`},
      {name:"parseInt(str)",desc:"Преобразует строку в целое число",example:`parseInt("42px") // 42`},
      {name:"parseFloat(str)",desc:"Преобразует строку в число с плавающей точкой",example:`parseFloat("3.14") // 3.14`},
      {name:"toFixed(n)",desc:"Округляет до n знаков после запятой",example:`(3.1415).toFixed(2) // "3.14"`},
      {name:"Math.round(n)",desc:"Округление до ближайшего целого",example:`Math.round(3.7) // 4`},
      {name:"Math.floor(n)",desc:"Округление вниз",example:`Math.floor(3.7) // 3`},
      {name:"Math.ceil(n)",desc:"Округление вверх",example:`Math.ceil(3.1) // 4`},
      {name:"Math.abs(n)",desc:"Модуль числа",example:`Math.abs(-5) // 5`},
      {name:"Math.min(...) / Math.max(...)",desc:"Минимальное/максимальное число",example:`Math.max(1,3,2) // 3`},
      {name:"Math.random()",desc:"Случайное число от 0 до 1",example:`Math.random() // 0.123...`},
      {name:"Math.pow(a,b)",desc:"Возведение в степень",example:`Math.pow(2,3) // 8`},
      {name:"Math.sqrt(n)",desc:"Квадратный корень",example:`Math.sqrt(9) // 3`}
    ]
  },
  {
    id:"promise",title:"Promise / Async",
    items:[
      {name:"new Promise(fn)",desc:"Создание промиса",example:`new Promise((res)=>res(1))`},
      {name:"Promise.resolve(v)",desc:"Создаёт разрешённый промис",example:`Promise.resolve(1)`},
      {name:"Promise.reject(e)",desc:"Создаёт отклонённый промис",example:`Promise.reject(new Error())`},
      {name:".then(fn)",desc:"Обработка успешного результата",example:`Promise.resolve(1).then(v=>v+1)`},
      {name:".catch(fn)",desc:"Обработка ошибки",example:`Promise.reject("err").catch(e=>e)`},
      {name:".finally(fn)",desc:"Выполняется в любом случае",example:`promise.finally(()=>cleanup())`},
      {name:"Promise.all([...])",desc:"Ждёт все промисы (ошибка — сразу reject)",example:`Promise.all([p1,p2])`},
      {name:"Promise.allSettled([...])",desc:"Ждёт все промисы (всегда resolve)",example:`Promise.allSettled([p1,p2])`},
      {name:"Promise.race([...])",desc:"Ждёт первый завершённый промис",example:`Promise.race([p1,p2])`},
      {name:"Promise.any([...])",desc:"Ждёт первый успешный промис",example:`Promise.any([p1,p2])`},
      {name:"async function",desc:"Объявление асинхронной функции",example:`async function foo(){return 1}`},
      {name:"await",desc:"Ожидание результата промиса",example:`const res=await fetch(url)`},
      {name:"try/catch",desc:"Обработка ошибок в async/await",example:`try{await fn()}catch(e){}`}
    ]
  },
  {
    id:"mapset",title:"Map / Set / Date",
    items:[
      {name:"new Map()",desc:"Коллекция ключ-значение (ключ — любой тип)",example:`m.set("a",1).get("a") // 1`},
      {name:"Map: set/get/has/delete/size",desc:"Основные методы Map",example:`m.has("a") // true`},
      {name:"new Set()",desc:"Коллекция уникальных значений",example:`new Set([1,1,2]) // Set{1,2}`},
      {name:"Set: add/has/delete/size",desc:"Основные методы Set",example:`s.add(3).has(3) // true`},
      {name:"new Date()",desc:"Текущая дата и время",example:`new Date().toISOString()`},
      {name:"Date: getFullYear/getMonth/getDate",desc:"Получение компонентов даты",example:`d.getFullYear() // 2026`},
      {name:"Date: toISOString()",desc:"Дата в формате ISO",example:`new Date().toISOString()`},
      {name:"Date.now()",desc:"Текущее время в миллисекундах (Unix-время)",example:`Date.now() // 1_777_000_000_000`}
    ]
  },
  {
    id:"json",title:"JSON",
    items:[
      {name:"JSON.stringify(obj)",desc:"Преобразует объект в JSON-строку",example:`JSON.stringify({a:1}) // '{"a":1}'`},
      {name:"JSON.parse(str)",desc:"Преобразует JSON-строку в объект",example:`JSON.parse('{"a":1}') // {a:1}`}
    ]
  },
  {
    id:"typescript",title:"TypeScript",
    items:[
      {name:"type",desc:"Псевдоним типа",example:"type ID = string | number"},
      {name:"interface",desc:"Описание структуры объекта",example:"interface User { name: string; age: number }"},
      {name:"generics (<T>)",desc:"Обобщённые типы",example:"function id<T>(x: T): T { return x }"},
      {name:"union (|)",desc:"Объединение типов",example:"let x: string | number"},
      {name:"intersection (&)",desc:"Пересечение типов",example:"type A = B & C"},
      {name:"Pick<T,K>",desc:"Выбирает указанные ключи из типа",example:'Pick<User,"name"> // {name:string}'},
      {name:"Omit<T,K>",desc:"Исключает указанные ключи из типа",example:'Omit<User,"age"> // {name:string}'},
      {name:"Partial<T>",desc:"Делает все поля необязательными",example:"Partial<User> // {name?:string;age?:number}"},
      {name:"Required<T>",desc:"Делает все поля обязательными",example:"Required<Partial<User>>"},
      {name:"Readonly<T>",desc:"Делает все поля только для чтения",example:"Readonly<User>"},
      {name:"Record<K,V>",desc:"Тип объекта с ключами K и значениями V",example:"Record<string,number> // {[key:string]:number}"},
      {name:"as const",desc:"Литеральный тип (immutable)",example:'const x = "foo" as const'},
      {name:"satisfies",desc:"Проверяет соответствие типу без сужения",example:"const x = {a:1} satisfies Record<string,number>"},
      {name:"enum",desc:"Перечисление",example:"enum Color { Red, Green, Blue }"},
      {name:"unknown vs any",desc:"unknown — безопасная версия any",example:"let u: unknown; let a: any"},
      {name:"never",desc:"Тип для никогда не выполняющегося кода",example:"function fail(): never { throw Error() }"}
    ]
  },
  {
    id:"react",title:"React Hooks",
    items:[
      {name:"useState<T>(init)",desc:"Состояние компонента",example:"const [count,setCount]=useState(0)"},
      {name:"useEffect(fn,deps)",desc:"Побочные эффекты (запросы,подписки)",example:"useEffect(()=>fetch(url),[id])"},
      {name:"useMemo(fn,deps)",desc:"Мемоизация вычислений",example:"const total=useMemo(()=>sum(arr),[arr])"},
      {name:"useCallback(fn,deps)",desc:"Мемоизация функции",example:"const cb=useCallback(()=>fn(id),[id])"},
      {name:"useRef(init)",desc:"Ссылка на DOM / mutable значение",example:"const ref=useRef<HTMLDiv>(null)"},
      {name:"useContext(ctx)",desc:"Доступ к контексту",example:"const theme=useContext(ThemeContext)"},
      {name:"useReducer(reducer,init)",desc:"Сложное состояние через reducer",example:"const [state,dispatch]=useReducer(reducer,init)"},
      {name:"useLocation()",desc:"Текущий URL (react-router-dom)",example:"const loc=useLocation()"},
      {name:"useNavigate()",desc:"Навигация (react-router-dom)",example:"const nav=useNavigate(); nav('/home')"},
      {name:"useParams()",desc:"Параметры маршрута (react-router-dom)",example:"const {id}=useParams()"}
    ]
  },
  {
    id:"axios",title:"Axios (HTTP-запросы)",
    items:[
      {name:"axios.get(url,config?)",desc:"GET-запрос",example:"const {data}=await axios.get('/api/items')"},
      {name:"axios.post(url,body,config?)",desc:"POST-запрос",example:"await axios.post('/api/items',{name:'x'})"},
      {name:"axios.put(url,body,config?)",desc:"PUT-запрос (обновление)",example:"await axios.put('/api/items/1',{price:100})"},
      {name:"axios.delete(url,config?)",desc:"DELETE-запрос",example:"await axios.delete('/api/items/1')"},
      {name:"axios.patch(url,body,config?)",desc:"PATCH-запрос (частичное обновление)",example:"await axios.patch('/api/items/1',{stock:0})"},
      {name:"axios.create(config)",desc:"Создание инстанса с базовым URL",example:"const api=axios.create({baseURL:'/api'})"},
      {name:"interceptors",desc:"Перехватчики запросов/ответов",example:"api.interceptors.request.use(cfg=>cfg)"},
      {name:"axios.all([...])",desc:"Множественные запросы (аналог Promise.all)",example:"const [a,b]=await axios.all([p1,p2])"}
    ]
  },
  {
    id:"dom",title:"DOM / браузерные API",
    items:[
      {name:"querySelector(css)",desc:"Ищет первый элемент по CSS-селектору",example:"document.querySelector('.foo')"},
      {name:"querySelectorAll(css)",desc:"Ищет все элементы по CSS-селектору",example:"document.querySelectorAll('div')"},
      {name:"addEventListener(event,fn)",desc:"Вешает обработчик события",example:"el.addEventListener('click',()=>{})"},
      {name:"classList.add/remove/toggle",desc:"Управление CSS-классами",example:"el.classList.toggle('active')"},
      {name:"setTimeout(fn,ms)",desc:"Вызов функции через ms миллисекунд",example:"const id=setTimeout(()=>{},1000)"},
      {name:"setInterval(fn,ms)",desc:"Вызов функции каждые ms миллисекунд",example:"const id=setInterval(()=>{},1000)"},
      {name:"clearTimeout/clearInterval",desc:"Отмена таймера",example:"clearTimeout(id)"},
      {name:"fetch(url)",desc:"Встроенный HTTP-клиент",example:"const res=await fetch(url);const data=await res.json()"},
      {name:"localStorage",desc:"Хранилище в браузере",example:"localStorage.setItem('key','val')"},
      {name:"window.location",desc:"Информация о текущем URL и навигация",example:"window.location.href='/home'"}
    ]
  }
];

const sidebar = document.getElementById("sidebar");
const content = document.getElementById("content");
let active = "string";

function render() {
  sidebar.innerHTML = sections.map(s =>
    `<div class="item${s.id===active?" active":""}" onclick="navigate('${s.id}')">${s.title}</div>`
  ).join("");

  const sec = sections.find(s=>s.id===active);
  if(!sec) return;

  content.innerHTML = `
    <h1>${sec.title}</h1>
    <div class="grid">
      ${sec.items.map(i=>`
        <div class="card">
          <code>${i.name}</code>
          <p>${i.desc}</p>
          <pre>${i.example}</pre>
        </div>
      `).join("")}
    </div>
  `;
}

function navigate(id) { active=id; render(); }
render();
</script>

</body>
</html>
