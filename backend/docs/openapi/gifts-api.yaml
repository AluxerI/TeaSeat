            product_sizes:
              type: array
              description: Полный непагинированный каталог для коробки.
              items:
                $ref: '#/components/schemas/ProductSize'

    LayoutValidationEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [valid, box, layout]
          properties:
            valid:
              type: boolean
              const: true
            box:
              $ref: '#/components/schemas/GiftSizeProfile'
            layout:
              type: array
              items:
                $ref: '#/components/schemas/LayoutItem'

    GiftQuoteEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required:
            - valid
            - box
            - layout
            - quantity
            - required_products
            - totals
          properties:
            valid:
              type: boolean
              const: true
            box:
              $ref: '#/components/schemas/GiftSizeProfile'
            layout:
              type: array
              items:
                $ref: '#/components/schemas/LayoutItem'
            quantity:
              type: integer
              minimum: 1
            required_products:
              type: object
              description: Объект product_id -> складское количество.
              additionalProperties:
                type: integer
                minimum: 1
            totals:
              $ref: '#/components/schemas/PricingQuote'

    PricingQuote:
      type: object
      required:
        - currency
        - products_total
        - gift_markup_total
        - promotion_discount
        - personal_discount
        - cart_discount
        - shipping_cost
        - shipping_discount
        - final_total
        - lines
        - gifts
        - calculated_at
      properties:
        currency:
          const: RUB
        products_total:
          type: number
        gift_markup_total:
          type: number
        promotion_discount:
          type: number
        personal_discount:
          type: number
        cart_discount:
          type: number
        shipping_cost:
          type: number
        shipping_discount:
          type: number
        final_total:
          type: number
        selected_discount:
          type: [object, 'null']
          additionalProperties: true
        lines:
          type: array
          items:
            type: object
            additionalProperties: true
        gifts:
          type: array
          items:
            $ref: '#/components/schemas/GiftPrice'
        usages:
          type: array
          items:
            type: object
            required: [discount_id, uses]
            properties:
              discount_id:
                type: integer
              uses:
                type: integer
        calculated_at:
          type: string
          format: date-time

    GiftPrice:
      type: object
      required:
        - order_gift_id
        - quantity
        - markup_unit_amount
        - markup_total_amount
        - components_base_total
        - components_discount_amount
        - total_price
      properties:
        order_gift_id:
          type: integer
        quantity:
          type: integer
        markup_unit_amount:
          type: number
        markup_total_amount:
          type: number
        components_base_total:
          type: number
        components_discount_amount:
          type: number
        total_price:
          type: number

    GiftItem:
      type: object
      required:
        - id
        - client_item_id
        - product_size
        - position_x
        - position_y
        - is_rotated
        - sort_order
      properties:
        id:
          type: integer
        client_item_id:
          type: string
          format: uuid
        product_size:
          $ref: '#/components/schemas/ProductSize'
        position_x:
          type: integer
        position_y:
          type: integer
        is_rotated:
          type: boolean
        sort_order:
          type: integer

    Gift:
      type: object
      required:
        - id
        - name
        - status
        - visibility
        - version
        - markup_amount
        - box
        - layout
        - items
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [draft, active, archived]
        visibility:
          const: private
        version:
          type: integer
          minimum: 1
        markup_amount:
          type: number
          minimum: 0
        box:
          $ref: '#/components/schemas/GiftSizeProfile'
        layout:
          type: array
          items:
            $ref: '#/components/schemas/LayoutItem'
        items:
          type: array
          items:
            $ref: '#/components/schemas/GiftItem'
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time

    GiftEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Gift'

    GiftListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Gift'

