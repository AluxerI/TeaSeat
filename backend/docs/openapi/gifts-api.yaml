          type: integer
          minimum: 1
          maximum: 100
        client_instance_id:
          type: string
          format: uuid
        city:
          type: [string, 'null']
          maxLength: 255

    GiftCartUpdateRequest:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 100
        city:
          type: [string, 'null']
          maxLength: 255

    CartEnvelope:
