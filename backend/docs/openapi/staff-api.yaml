openapi: 3.1.0
info:
  title: TeaSeat Staff API
  version: 1.2.0
  description: >-
    Контракт backend для PWA продавца, сборщика, менеджера и курьера.
    Подробные бизнес-правила находятся в docs/staff-api-contract.md.
servers:
  - url: /api
tags:
  - name: Auth
  - name: Delivery
  - name: Seller
  - name: Picker
  - name: Courier
  - name: Manager
  - name: Order management

paths:
  /orders/{order}/requests:
    get:
      tags: [Manager]
      summary: История обращений клиента по своему заказу
      operationId: customerOrderRequests
      x-laravel-route-name: orders.requests.index
      parameters:
        - {name: order, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Manager]
      summary: Создать обращение по своему заказу
      operationId: createCustomerOrderRequest
      x-laravel-route-name: orders.requests.store
      parameters:
        - {name: order, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrderRequest'}
      responses:
        '201': {$ref: '#/components/responses/GenericData'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}

  /order-requests/{orderRequest}/withdraw:
    post:
      tags: [Manager]
      summary: Отозвать ожидающее обращение клиента
      operationId: withdrawCustomerOrderRequest
      x-laravel-route-name: order-requests.withdraw
      parameters:
        - {name: orderRequest, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /manager/order-requests:
    get:
      tags: [Manager]
      summary: Очередь обращений доступных менеджеру складов
      operationId: managerOrderRequests
      x-laravel-route-name: manager.order-requests.index
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /manager/order-requests/{orderRequest}:
    get:
      tags: [Manager]
      summary: Карточка обращения клиента
      operationId: managerOrderRequest
      x-laravel-route-name: manager.order-requests.show
      parameters:
        - {name: orderRequest, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
        '404': {$ref: '#/components/responses/NotFound'}

  /manager/order-requests/{orderRequest}/take:
    post:
      tags: [Manager]
      summary: Взять обращение в работу
      operationId: takeManagerOrderRequest
      x-laravel-route-name: manager.order-requests.take
      parameters:
        - {name: orderRequest, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
        '409': {$ref: '#/components/responses/Conflict'}

  /manager/order-requests/{orderRequest}/release:
    post:
      tags: [Manager]
      summary: Вернуть своё обращение в очередь
      operationId: releaseManagerOrderRequest
      x-laravel-route-name: manager.order-requests.release
      parameters:
        - {name: orderRequest, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
        '409': {$ref: '#/components/responses/Conflict'}

  /manager/order-requests/{orderRequest}/resolve:
    post:
      tags: [Manager]
      summary: Завершить обращение с ответом клиенту
      operationId: resolveManagerOrderRequest
      x-laravel-route-name: manager.order-requests.resolve
      parameters:
        - {name: orderRequest, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManagerOrderRequestComment'}
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
        '409': {$ref: '#/components/responses/Conflict'}

  /manager/order-requests/{orderRequest}/reject:
    post:
      tags: [Manager]
      summary: Отклонить обращение с объяснением
      operationId: rejectManagerOrderRequest
      x-laravel-route-name: manager.order-requests.reject
      parameters:
        - {name: orderRequest, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManagerOrderRequestComment'}
      responses:
        '200': {$ref: '#/components/responses/GenericData'}
        '409': {$ref: '#/components/responses/Conflict'}

  /auth/login:
    post:
      tags: [Auth]
      summary: Войти и получить контекст сотрудника
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Токен и профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Удалить текущий токен
      operationId: authLogout
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /checkout/delivery-slots/{addressId}/{deliveryMethodId}:
    get:
      tags: [Delivery]
      summary: Доступные даты и интервалы доставки для адреса покупателя
      description: >-
        Возвращает только интервалы с оставшейся вместимостью в пределах
        горизонта бронирования. Адрес должен принадлежать текущему пользователю.
      operationId: checkoutDeliverySlots
      x-laravel-route-name: checkout.delivery-slots
      parameters:
        - name: addressId
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: deliveryMethodId
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Календарь доступных интервалов
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DeliveryAvailability'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /user:
    get:
      tags: [Auth]
      summary: Получить актуальные роли, права и рабочие точки
      operationId: currentUser
      x-laravel-route-name: user.show
      responses:
        '200':
          description: Профиль в стандартной обёртке JsonResource
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/UserContext'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /seller/devices/register:
    post:
      tags: [Seller]
      summary: Зарегистрировать устройство продавца
      description: 'Permission: create seller orders.'
      operationId: sellerRegisterDevice
      x-laravel-route-name: seller.devices.register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '201':
          $ref: '#/components/responses/StaffDeviceData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /seller/bootstrap:
    get:
      tags: [Seller]
      summary: Получить каталог, остатки и подписанные цены точки
      description: 'Permission: create seller orders. Rate limit: 30/min.'
      operationId: sellerBootstrap
      x-laravel-route-name: seller.bootstrap
      parameters:
        - $ref: '#/components/parameters/DeviceUuid'
        - $ref: '#/components/parameters/WarehouseIdRequired'
      responses:
        '200':
          $ref: '#/components/responses/GenericData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /seller/orders:
    get:
      tags: [Seller]
      summary: Собственные продажи продавца
      description: 'Permission: view own seller orders.'
      operationId: sellerOrdersIndex
      x-laravel-route-name: seller.orders.index
      parameters:
        - $ref: '#/components/parameters/DeviceUuid'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SellerOrderStatus'
        - $ref: '#/components/parameters/WarehouseId'
        - name: date_from
          in: query
          schema: {type: string, format: date}
        - name: date_to
          in: query
          schema: {type: string, format: date}
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/SellerOrderList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Seller]
      summary: Создать или идемпотентно синхронизировать продажу
      description: 'Permission: create seller orders.'
      operationId: sellerOrdersStore
      x-laravel-route-name: seller.orders.store
      parameters:
        - $ref: '#/components/parameters/DeviceUuid'
      requestBody:
        $ref: '#/components/requestBodies/SellerOrderSnapshot'
      responses:
        '201':
          $ref: '#/components/responses/SellerOrderData'
        '200':
          description: Такая версия уже была принята
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SellerOrderCommandResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /seller/orders/{order}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
      - $ref: '#/components/parameters/DeviceUuid'
    get:
      tags: [Seller]
      summary: Получить свою продажу
      description: 'Permission: view own seller orders.'
      operationId: sellerOrdersShow
      x-laravel-route-name: seller.orders.show
      responses:
        '200':
          $ref: '#/components/responses/SellerOrderData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Seller]
      summary: Передать следующую полную версию продажи
      description: 'Permission: create seller orders.'
      operationId: sellerOrdersUpdate
      x-laravel-route-name: seller.orders.update
      requestBody:
        $ref: '#/components/requestBodies/SellerOrderSnapshot'
      responses:
        '200':
          $ref: '#/components/responses/SellerOrderData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /seller/orders/{order}/cancel:
    post:
      tags: [Seller]
      summary: Отменить непроведённую продажу
      description: 'Permission: create seller orders.'
      operationId: sellerOrdersCancel
      x-laravel-route-name: seller.orders.cancel
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/DeviceUuid'
      requestBody:
        $ref: '#/components/requestBodies/RevisionCommand'
      responses:
        '200':
          $ref: '#/components/responses/SellerOrderData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /seller/orders/complete:
    post:
      tags: [Seller]
      summary: Завершить до 100 продаж независимо друг от друга
      description: 'Permission: complete own seller orders.'
      operationId: sellerOrdersComplete
      x-laravel-route-name: seller.orders.complete
      parameters:
        - $ref: '#/components/parameters/DeviceUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSellerOrdersRequest'
      responses:
        '200':
          $ref: '#/components/responses/SellerBatchResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /seller/orders/{order}/escalate:
    post:
      tags: [Seller]
      summary: Подтвердить конфликт и передать его менеджеру
      description: 'Permission: complete own seller orders.'
      operationId: sellerOrdersEscalate
      x-laravel-route-name: seller.orders.escalate
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/DeviceUuid'
      requestBody:
        $ref: '#/components/requestBodies/RevisionCommand'
      responses:
        '200':
          $ref: '#/components/responses/SellerCommandResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /seller/sync:
    post:
      tags: [Seller]
      summary: Синхронизировать офлайн-очередь продавца
      description: >-
        Permissions: create seller orders + complete own seller orders.
        Каждое событие обрабатывается независимо. Rate limit: 30/min.
      operationId: sellerSync
      x-laravel-route-name: seller.sync
      parameters:
        - $ref: '#/components/parameters/DeviceUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerSyncRequest'
      responses:
        '200':
          $ref: '#/components/responses/SellerSyncResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /picker/orders:
    get:
      tags: [Picker]
      summary: Очередь сборки в активных точках
      description: 'Permission: view picking orders.'
      operationId: pickerOrdersIndex
      x-laravel-route-name: picker.orders.index
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [confirmed, processing]
        - $ref: '#/components/parameters/WarehouseId'
        - name: job_type
          in: query
          schema:
            type: string
            enum: [source, consolidation]
        - $ref: '#/components/parameters/Mine'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/PickerOrderList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /picker/orders/{order}:
    get:
      tags: [Picker]
      summary: Заказ для сборки
      description: 'Permission: view picking orders.'
      operationId: pickerOrdersShow
      x-laravel-route-name: picker.orders.show
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/PickerOrderData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /picker/orders/{order}/take:
    post:
      tags: [Picker]
      summary: Взять заказ в сборку
      description: 'Permission: manage own picking orders.'
      operationId: pickerOrdersTake
      x-laravel-route-name: picker.orders.take
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/PickerOrderData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /picker/orders/{order}/release:
    post:
      tags: [Picker]
      summary: Вернуть заказ в очередь сборки
      description: 'Permission: manage own picking orders.'
      operationId: pickerOrdersRelease
      x-laravel-route-name: picker.orders.release
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/PickerOrderData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /picker/orders/{order}/complete:
    post:
      tags: [Picker]
      summary: Завершить упаковку и провести складское списание
      description: 'Permission: manage own picking orders.'
      operationId: pickerOrdersComplete
      x-laravel-route-name: picker.orders.complete
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/PickerOrderData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /picker/orders/{order}/escalate:
    post:
      tags: [Picker]
      summary: Передать заказ менеджеру с комментарием
      description: 'Permission: manage own picking orders.'
      operationId: pickerOrdersEscalate
      x-laravel-route-name: picker.orders.escalate
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        $ref: '#/components/requestBodies/RequiredComment'
      responses:
        '200':
          $ref: '#/components/responses/PickerOrderData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /picker/orders/{order}/shortage:
    post:
      tags: [Picker]
      summary: Сообщить менеджеру о физической недостаче
      description: 'Permission: report picking shortage.'
      operationId: pickerOrdersShortage
      x-laravel-route-name: picker.orders.shortage
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickerShortageRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /picker/incoming-transfers:
    get:
      tags: [Picker]
      summary: Межскладские упаковки, ожидающие приёмки
      description: 'Permission: view picking orders.'
      operationId: pickerTransfersIndex
      x-laravel-route-name: picker.transfers.index
      parameters:
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/PickerOrderList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /picker/incoming-transfers/{order}/receive:
    post:
      tags: [Picker]
      summary: Подтвердить приём межскладской упаковки
      description: 'Permission: manage own picking orders.'
      operationId: pickerTransfersReceive
      x-laravel-route-name: picker.transfers.receive
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/PickerOrderData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /courier/deliveries:
    get:
      tags: [Courier]
      summary: Свободные и собственные доставки активных точек
      description: 'Permission: view assigned deliveries.'
      operationId: courierDeliveriesIndex
      x-laravel-route-name: courier.deliveries.index
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ready_for_delivery, shipped, awaiting_receipt, delivered]
        - $ref: '#/components/parameters/WarehouseId'
        - name: delivery_kind
          in: query
          schema:
            type: string
            enum: [transfer, customer]
        - $ref: '#/components/parameters/Mine'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/CourierDeliveryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /courier/deliveries/{order}:
    get:
      tags: [Courier]
      summary: Доставка или межскладское перемещение
      description: 'Permission: view assigned deliveries.'
      operationId: courierDeliveriesShow
      x-laravel-route-name: courier.deliveries.show
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/CourierDeliveryData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /courier/deliveries/{order}/claim:
    post:
      tags: [Courier]
      summary: Взять свободную доставку
      description: 'Permission: update assigned deliveries.'
      operationId: courierDeliveriesClaim
      x-laravel-route-name: courier.deliveries.claim
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/CourierDeliveryData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /courier/deliveries/{order}/release:
    post:
      tags: [Courier]
      summary: Отказаться до начала доставки
      description: 'Permission: update assigned deliveries.'
      operationId: courierDeliveriesRelease
