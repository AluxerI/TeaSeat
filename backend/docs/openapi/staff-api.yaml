      x-laravel-route-name: management.orders.stats
      parameters:
        - name: date_from
          in: query
          schema: {type: string, format: date}
        - name: date_to
          in: query
          schema: {type: string, format: date}
      responses:
        '200':
          $ref: '#/components/responses/GenericData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/orders/{order}:
    get:
      tags: [Order management]
      summary: Детали заказа
      description: 'Role: admin. Permission: manage orders.'
      operationId: managementOrdersShow
      x-laravel-route-name: management.orders.show
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/AdminOrderData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/orders/{order}/status:
    put:
      tags: [Order management]
      summary: Изменить разрешённый статус заказа
      description: 'Role: admin. Permission: manage orders.'
      operationId: managementOrdersUpdateStatus
      x-laravel-route-name: management.orders.update-status
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          $ref: '#/components/responses/AdminOrderData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OrderTransitionConflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/orders/{order}/tracking:
    put:
      tags: [Order management]
      summary: Обновить трек-номер
      description: 'Role: admin. Permission: manage orders.'
      operationId: managementOrdersUpdateTracking
      x-laravel-route-name: management.orders.update-tracking
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tracking_number]
              properties:
                tracking_number: {type: string, maxLength: 100}
                carrier: {type: [string, 'null'], maxLength: 100}
      responses:
        '200':
          $ref: '#/components/responses/AdminOrderData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/orders/{order}/internal-notes:
    put:
      tags: [Order management]
      summary: Обновить внутренний комментарий
      description: 'Role: admin. Permission: manage orders.'
      operationId: managementOrdersUpdateInternalNotes
      x-laravel-route-name: management.orders.update-internal-notes
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [internal_notes]
              properties:
                internal_notes: {type: string, maxLength: 2000}
      responses:
        '200':
          $ref: '#/components/responses/AdminOrderData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/orders/{order}/cancel:
    put:
      tags: [Order management]
      summary: Отменить заказ менеджером
      description: 'Role: admin. Permission: manage orders.'
      operationId: managementOrdersCancel
      x-laravel-route-name: management.orders.cancel
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: [string, 'null'], maxLength: 500}
      responses:
        '200':
          $ref: '#/components/responses/AdminOrderData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OrderTransitionConflict'

  /admin/orders/{order}/confirm:
    put:
      tags: [Order management]
      summary: Подтвердить заказ
      description: 'Role: admin. Permission: manage orders.'
      operationId: managementOrdersConfirm
      x-laravel-route-name: management.orders.confirm
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/AdminOrderData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OrderTransitionConflict'

  /admin/orders/{order}/ship:
    put:
      tags: [Order management]
      summary: Передать внешний заказ в доставку
      description: 'Role: admin. Permission: manage orders. Внутреннего курьера запускает courier API.'
      operationId: managementOrdersShip
      x-laravel-route-name: management.orders.ship
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/AdminOrderData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OrderTransitionConflict'

  /admin/orders/{order}/deliver:
    put:
      tags: [Order management]
      summary: Завершить выдачу или внешнюю доставку
      description: 'Role: admin. Permission: manage orders. Внутреннюю доставку завершает courier API.'
      operationId: managementOrdersDeliver
      x-laravel-route-name: management.orders.deliver
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/AdminOrderData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OrderTransitionConflict'

  /admin/orders/{order}/delivery-method:
    put:
      tags: [Order management]
      summary: Изменить способ и стоимость доставки
      description: 'Role: admin. Permission: manage orders.'
      operationId: managementOrdersUpdateDeliveryMethod
      x-laravel-route-name: management.orders.update-delivery-method
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delivery_method_id]
              properties:
                delivery_method_id: {type: integer}
                shipping_cost: {type: [number, 'null'], minimum: 0}
      responses:
        '200':
          $ref: '#/components/responses/AdminOrderData'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

security:
  - sanctum: []

components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  parameters:
    OrderId:
      name: order
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    IssueId:
      name: issue
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    DeviceUuid:
      name: X-Device-UUID
      in: header
      required: true
      schema: {type: string, format: uuid}
    WarehouseId:
      name: warehouse_id
      in: query
      schema: {type: integer, minimum: 1}
    WarehouseIdRequired:
      name: warehouse_id
      in: query
      required: true
      schema: {type: integer, minimum: 1}
    PerPage:
      name: per_page
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Mine:
      name: mine
      in: query
      schema: {type: boolean}

  requestBodies:
    SellerOrderSnapshot:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SellerOrderSnapshot'
    RevisionCommand:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [revision]
            properties:
              revision: {type: integer, minimum: 1}
    RequiredComment:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [comment]
            properties:
              comment: {type: string, maxLength: 1000}

  responses:
    Message:
      description: Команда выполнена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    GenericData:
      description: Данные операции
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericDataEnvelope'
    StaffDeviceData:
      description: Устройство зарегистрировано
      content:
        application/json:
          schema:
            type: object
            required: [message, data]
            properties:
              message: {type: string}
              data:
                $ref: '#/components/schemas/StaffDevice'
    SellerOrderData:
      description: Продажа продавца
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SellerOrderCommandResponse'
    SellerOrderList:
      description: Страница продаж продавца
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SellerOrderListResponse'
    SellerBatchResult:
      description: Независимый результат каждой команды
      content:
        application/json:
          schema:
            type: object
            required: [results]
            properties:
              results:
                type: array
                items:
                  $ref: '#/components/schemas/SellerCommandResult'
    SellerCommandResult:
      description: Результат команды продавца
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SellerCommandResult'
    SellerSyncResult:
      description: Результат офлайн-синхронизации
      content:
        application/json:
          schema:
            type: object
            required: [server_time, results]
            properties:
              server_time: {type: string, format: date-time}
              results:
                type: array
                items:
                  $ref: '#/components/schemas/SellerSyncEventResult'
    PickerOrderData:
      description: Состояние сборки
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PickerOrderCommandResponse'
    PickerOrderList:
      description: Страница заданий сборщика
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PickerOrderListResponse'
    CourierDeliveryData:
      description: Состояние доставки
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CourierDeliveryCommandResponse'
    CourierDeliveryList:
      description: Страница доставок
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CourierDeliveryListResponse'
    FulfillmentIssueData:
      description: Дело менеджера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FulfillmentIssueCommandResponse'
    FulfillmentIssueList:
      description: Страница дел менеджера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FulfillmentIssueListResponse'
    AffectedOrderList:
      description: Динамический список кандидатов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AffectedOrderListResponse'
    ManagerOrderData:
      description: Полная карточка заказа в области доступа менеджера
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/ManagerOrder'
    ManagerOrderList:
      description: Страница основных заказов менеджера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagerOrderListResponse'
    AdminOrderData:
      description: Управленческое представление заказа
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminOrderCommandResponse'
    AdminOrderList:
      description: Страница заказов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminOrderListResponse'
    Unauthorized:
      description: Токен отсутствует или недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Недостаточно прав или нет доступа к рабочей точке
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Объект не найден или недоступен сотруднику
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Переход состояния отклонён
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OrderTransitionConflict:
      description: Переход заказа отклонён его workflow
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  code: {const: order_transition_rejected}
    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    TooManyRequests:
      description: Лимит запросов превышен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    CreateOrderRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [change_delivery, cancel_order, order_problem, other]
        message:
          type: [string, 'null']
          maxLength: 5000
          description: Обязательно для order_problem и other.
    ManagerOrderRequestComment:
      type: object
      required: [manager_comment]
      properties:
        manager_comment: {type: string, minLength: 1, maxLength: 5000}
    DeliveryAvailability:
      type: object
      required: [delivery_method, booking_horizon_days, dates]
      properties:
        delivery_method:
          type: object
          required: [id, name, type]
          properties:
            id: {type: integer}
            name: {type: string}
            type: {type: string, enum: [courier, express]}
        booking_horizon_days: {type: integer, minimum: 1}
        dates:
          type: array
          items:
            type: object
            required: [date, weekday, slots]
            properties:
              date: {type: string, format: date}
              weekday: {type: integer, minimum: 1, maximum: 7}
              slots:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryAvailabilitySlot'
    DeliveryAvailabilitySlot:
      type: object
      required: [id, time_from, time_to, capacity, booked, remaining_capacity]
      properties:
        id: {type: integer}
        time_from: {type: string, pattern: '^\d{2}:\d{2}$'}
        time_to: {type: string, pattern: '^\d{2}:\d{2}$'}
        capacity: {type: integer, minimum: 1}
        booked: {type: integer, minimum: 0}
        remaining_capacity: {type: integer, minimum: 1}
    ScheduledDeliveryWindow:
      type: object
      required: [date, time_from, time_to, slot_id]
      properties:
        date: {type: string, format: date}
        time_from: {type: string, pattern: '^\d{2}:\d{2}$'}
        time_to: {type: string, pattern: '^\d{2}:\d{2}$'}
        slot_id: {type: integer}
        claim_opens_at: {type: [string, 'null'], format: date-time}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    LoginResponse:
      type: object
      required: [message, user, token, token_type]
      properties:
        message: {type: string}
        user:
          $ref: '#/components/schemas/UserContext'
        token: {type: string}
        token_type: {const: Bearer}
    UserContext:
      type: object
      required: [id, roles, permissions, work_locations, capabilities, is_active]
      properties:
        id: {type: integer}
        name: {type: string}
        email: {type: string, format: email}
        phone: {type: [string, 'null']}
        is_active: {type: boolean}
        roles:
          type: array
          items:
            type: string
            enum: [admin, manager, seller, picker, courier, user]
        permissions:
          type: array
          items: {type: string}
        work_locations:
          type: array
          items:
            $ref: '#/components/schemas/WorkLocation'
        capabilities:
          $ref: '#/components/schemas/Capabilities'
      additionalProperties: true
    WorkLocation:
      type: object
      required: [id, name, city, type, is_online_fulfillment_enabled, is_delivery_hub]
      properties:
        id: {type: integer}
        name: {type: string}
        city: {type: string}
        type:
          type: string
          enum: [warehouse, store]
        is_online_fulfillment_enabled: {type: boolean}
        is_delivery_hub: {type: boolean}
    Capabilities:
      type: object
      required: [admin, manager, seller, picker, courier, can_access_filament]
      properties:
        admin: {type: boolean}
        manager: {type: boolean}
        seller: {type: boolean}
        picker: {type: boolean}
        courier: {type: boolean}
        can_access_filament: {type: boolean}
    RegisterDeviceRequest:
      type: object
      required: [device_uuid, name]
      properties:
        device_uuid: {type: string, format: uuid}
        name: {type: string, maxLength: 120}
        warehouse_id: {type: [integer, 'null'], minimum: 1}
    StaffDevice:
      type: object
      required: [id, device_uuid, name]
      properties:
        id: {type: integer}
        device_uuid: {type: string, format: uuid}
        name: {type: string}
        last_warehouse_id: {type: [integer, 'null']}
        last_sync_at: {type: [string, 'null'], format: date-time}
        last_seen_at: {type: [string, 'null'], format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
    SellerOrderSnapshot:
      type: object
      required: [client_order_id, revision, warehouse_id, occurred_at, payment_method, items]
      properties:
        client_order_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        warehouse_id: {type: integer, minimum: 1}
        occurred_at: {type: string, format: date-time}
        payment_method:
          type: string
          enum: [cash, card]
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [product_id, quantity, pricing_token]
            properties:
              product_id: {type: integer, minimum: 1}
              quantity: {type: integer, minimum: 1}
              pricing_token: {type: string, maxLength: 30000}
    CompleteSellerOrdersRequest:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [order_id, revision]
            properties:
              order_id: {type: integer, minimum: 1}
              revision: {type: integer, minimum: 1}
    SellerSyncRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            oneOf:
              - $ref: '#/components/schemas/SellerUpsertEvent'
              - $ref: '#/components/schemas/SellerCommandEvent'
    SellerUpsertEvent:
      allOf:
        - $ref: '#/components/schemas/SellerOrderSnapshot'
        - type: object
          required: [event_id, action]
          properties:
            event_id: {type: string, format: uuid}
            action: {const: upsert}
    SellerCommandEvent:
      type: object
      required: [event_id, action, order_id, revision]
      properties:
        event_id: {type: string, format: uuid}
        action:
          type: string
          enum: [cancel, complete, escalate]
        order_id: {type: integer, minimum: 1}
        revision: {type: integer, minimum: 1}
    SellerOrderStatus:
      type: string
      enum: [pending, seller_review, manager_review, completed, cancelled]
    SellerOrder:
      type: object
      required: [id, client_order_id, revision, sales_channel, status, actions, totals, timestamps]
      properties:
        id: {type: integer}
        order_number: {type: [string, 'null']}
        client_order_id: {type: string, format: uuid}
        revision: {type: integer}
        sales_channel: {const: seller}
        status:
          $ref: '#/components/schemas/SellerOrderStatus'
        status_name: {type: string}
        payment_method:
          type: string
          enum: [cash, card]
        was_edited: {type: boolean}
        actions:
          $ref: '#/components/schemas/ActionFlags'
        totals:
          type: object
          properties:
            products_total: {type: number}
            promotion_discount: {type: number}
            final_total: {type: number}
            currency: {type: string}
        items:
          type: array
          items: {type: object, additionalProperties: true}
        fulfillment_issues:
          type: array
          items:
            $ref: '#/components/schemas/FulfillmentIssue'
        timestamps: {type: object, additionalProperties: true}
      additionalProperties: true
    SellerOrderCommandResponse:
      type: object
      required: [data]
      properties:
        message: {type: string}
        duplicate: {type: boolean}
        data:
          $ref: '#/components/schemas/SellerOrder'
    SellerOrderListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SellerOrder'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    SellerCommandResult:
      type: object
      required: [order_id, result]
      properties:
        order_id: {type: integer}
        result:
          type: string
          enum: [completed, seller_review, manager_review, cancelled, rejected]
        conflicts:
          type: array
          items: {type: object, additionalProperties: true}
        message: {type: string}
        order:
          $ref: '#/components/schemas/SellerOrder'
    SellerSyncEventResult:
      type: object
      required: [event_id, result]
      properties:
        event_id: {type: string, format: uuid}
        result:
          type: string
          enum: [accepted, duplicate, completed, seller_review, manager_review, cancelled, rejected]
        message: {type: string}
        errors: {type: object, additionalProperties: true}
        conflicts:
          type: array
          items: {type: object, additionalProperties: true}
        order:
          $ref: '#/components/schemas/SellerOrder'
    PickerShortageRequest:
      type: object
      required: [product_id, shortage_quantity]
      properties:
        product_id: {type: integer, minimum: 1}
        shortage_quantity: {type: integer, minimum: 1}
        comment: {type: [string, 'null'], maxLength: 1000}
    PickerOrder:
      type: object
      required: [id, customer_order_id, job_type, status, items, actions, timestamps]
      properties:
        id: {type: integer}
        order_number: {type: [string, 'null']}
        customer_order_id: {type: integer}
        customer_order_number: {type: [string, 'null']}
        job_type:
          type: string
          enum: [source, consolidation]
        status:
          type: string
          enum: [confirmed, processing, ready_for_delivery, shipped, awaiting_receipt, packed, manager_review]
        status_name: {type: string}
        warehouse: {type: [object, 'null'], additionalProperties: true}
        destination_warehouse: {type: [object, 'null'], additionalProperties: true}
