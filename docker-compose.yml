services:
  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "8000:8000"
      - "6001:6001" 
    volumes:
      - ./backend:/app/backend:cached
      - /app/backend/vendor  
    environment:
      - OCTANE_SERVER=roadrunner
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend
    networks:
      - app

  pgsql:
    image: postgres:13
    restart: always
    container_name: pgsql
    environment:
      - POSTGRES_USER=my_user
      - POSTGRES_PASSWORD=102101
      - POSTGRES_DB=teaseatsql
    ports:
      - "5436:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./databases-files:/databases-files
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_user -d teaseatsql"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:alpine
    restart: always
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  app:
    driver: bridge