services:
  backend:
    container_name: backend
    image: teaseat-backend:dev
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:6001:6001"
    environment:
      - OCTANE_SERVER=roadrunner
    volumes:
      - backend_imports:/app/backend/storage/app/imports
      - ./backend/storage/app/public:/app/backend/storage/app/public
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    container_name: worker
    image: teaseat-backend:dev
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=120
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
    environment:
      - QUEUE_CONNECTION=redis
    volumes:
      - backend_imports:/app/backend/storage/app/imports
      - ./backend/storage/app/public:/app/backend/storage/app/public
    restart: unless-stopped

  frontend:
    container_name: frontend
    image: teaseat-frontend:dev
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - app

  pgsql:
    image: postgres:15
    restart: always
    container_name: pgsql
    environment:
      - POSTGRES_USER=my_user
      - POSTGRES_PASSWORD=102101
      - POSTGRES_DB=teaseatsql
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./databases-files:/databases-files
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_user -d teaseatsql"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Отдельная одноразовая PostgreSQL для PHPUnit.
  # Запуск: docker compose --profile test up -d pgsql_test
  pgsql_test:
    image: postgres:15
    profiles: ["test"]
    environment:
      - POSTGRES_USER=my_user
      - POSTGRES_PASSWORD=102101
      - POSTGRES_DB=teaseatsql_test
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_user -d teaseatsql_test"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 3s

  redis:
    image: redis:alpine
    restart: always
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  app:
    driver: bridge

volumes:
  backend_vendor:
  backend_imports:
  frontend_node_modules:
