services:
  backend:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SANCTUM_STATEFUL_DOMAINS: "localhost,localhost:3000,127.0.0.1,127.0.0.1:3000,*.trycloudflare.com"
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax

  worker:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

  frontend:
    environment:
      VITE_API_URL: ""
      VITE_ADMIN_URL: /admin

  gateway:
    image: nginx:alpine
    container_name: gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/nginx/public-demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/gateway-health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --url http://gateway:8080
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - app
