map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

map $http_cf_connecting_ip $forwarded_for {
    default $http_cf_connecting_ip;
    '' $remote_addr;
}

upstream teaseat_frontend {
    server frontend:3000;
}

upstream teaseat_backend {
    server backend:8000;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /up {
        proxy_pass http://teaseat_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $forwarded_for;
    }

    # API, публичные файлы и все маршруты/ресурсы Filament идут в Laravel.
    location ~ ^/(?:api|sanctum|storage|admin|livewire|filament)(?:/|$) {
        proxy_pass http://teaseat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
    }

    location ~ ^/(?:css|js)/filament(?:/|$) {
        proxy_pass http://teaseat_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_redirect off;
    }

    # Vite остаётся только временным demo-origin. В production его заменит
    # статическая сборка frontend, а адрес gateway сохранится.
    location / {
        proxy_pass http://teaseat_frontend;
        proxy_http_version 1.1;
        # Vite разрешает localhost по умолчанию. Внешний адрес сохраняется
        # отдельно в X-Forwarded-Host для остальных участников цепочки.
        proxy_set_header Host localhost:3000;
        proxy_set_header X-Real-IP $forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
    }
}
